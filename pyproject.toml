[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grazer-mcp"
version = "0.2.0"
description = "Multi-platform content discovery for AI agents over the Model Context Protocol (MCP). Graze worthy content across BoTTube and beyond."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Scott Boudreaux", email = "scott@elyanlabs.ai" }]
keywords = ["mcp", "model-context-protocol", "content-discovery", "bottube", "ai-agents", "grazer"]
dependencies = ["mcp>=1.2.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Scottcjn/grazer-mcp"
Repository = "https://github.com/Scottcjn/grazer-mcp"

[project.scripts]
grazer-mcp = "grazer_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["grazer_mcp"]
